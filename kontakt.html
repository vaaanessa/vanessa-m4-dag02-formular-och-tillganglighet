<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boka bord – Kafé Kardemumma</title>
  </head>
  <body>
    <header>
      <h1>Kafé Kardemumma</h1>
      <nav aria-label="Huvudmeny">
        <ul>
          <li><a href="index.html">Startsida</a></li>
          <li><a href="index.html#meny">Meny</a></li>
          <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Boka bord</h2>
      <p>
        Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält
        markerade med * är obligatoriska.
      </p>
      <form action="#" method="post">
        <div class="falt">
          <label for="namn">Namn *</label>
          <input
            type="text"
            id="namn"
            name="namn"
            autocomplete="name"
            required
          />
        </div>

        <div class="falt">
          <label for="epost">E-postadress *</label>
          <input
            type="email"
            id="epost"
            name="epost"
            autocomplete="email"
            required
          />
        </div>

        <div class="falt">
          <label for="telefon">Telefon (valfritt)</label>
          <input type="tel" id="telefon" name="telefon" autocomplete="tel" />
        </div>

        <div class="falt">
          <label for="datum">Datum *</label>
          <input type="date" id="datum" name="datum" required />
        </div>

        <div class="falt">
          <label for="antal">Antal personer *</label>
          <select name="antal" id="antal" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5 eller fler</option>
          </select>
        </div>

        <fieldset>
          <legend>Kostönskemål</legend>

          <input
            type="checkbox"
            id="vegetarisk"
            name="kost"
            value="vegetarisk"
          />
          <label for="vegetarisk">Vegetarisk</label>

          <input type="checkbox" id="vegansk" name="kost" value="vegansk" />
          <label for="vegansk">Vegansk</label>

          <input type="checkbox" id="glutenfri" name="kost" value="glutenfri" />
          <label for="glutenfri">Glutenfri</label>
        </fieldset>

        <fieldset>
          <legend>Hur vill du få bekräftelsen? *</legend>

          <input
            type="radio"
            id="svar-epost"
            name="svar"
            value="epost"
            required
          />
          <label for="svar-epost">E-post</label>

          <input type="radio" id="svar-sms" name="svar" value="sms" required />
          <label for="svar-sms">SMS</label>
        </fieldset>

        <div class="falt">
          <label for="onskemal">Övriga önskemål</label>
          <textarea name="onskemal" id="onskemal"></textarea>
        </div>

        <div class="falt">
          <input
            type="checkbox"
            id="samtycke"
            name="samtycke"
            value="ja"
            required
          />
          <label for="samtycke"
            >Jag godkänner att Kafé Kardemumma sparar mina uppgifter för
            bokningen. *</label
          >
        </div>

        <button type="submit">Skicka bokning</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Kafé Kardemumma</p>
      <address>
        Fiktivgatan 1, 111 11 Stockholm<br />
        <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
      </address>
    </footer>
  </body>
</html>
